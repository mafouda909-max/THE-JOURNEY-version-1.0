name: Patch mobile safe audit fixes

on:
  push:
    branches: [integration/sila-resume-2026-10-03]
    paths:
      - .github/workflows/patch-mobile-audit-safe.yml

permissions:
  contents: write

jobs:
  patch-mobile-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/sila-resume-2026-10-03
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Apply only non-breaking audit fixes
        working-directory: mobile
        run: npm audit fix --package-lock-only --omit=dev --no-fund || true

      - name: Commit safe lock changes
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "No safe lock changes available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "chore(mobile): apply non-breaking audit fixes"
          git push origin HEAD:integration/sila-resume-2026-10-03
