name: One-time mobile audit remediation plan

on:
  push:
    branches:
      - security/nextjs-16.4.6-patch-2026-11-25
    paths:
      - .github/workflows/one-time-mobile-audit-plan.yml

permissions:
  contents: write

jobs:
  plan:
    if: github.ref == 'refs/heads/security/nextjs-16.4.6-patch-2026-11-25'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Calculate non-forced remediation plan without writing files
        working-directory: mobile
        run: |
          npm audit fix --dry-run --json > audit-fix-plan.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('audit-fix-plan.json','utf8'));
          const root = p.audit?.metadata?.vulnerabilities || p.metadata?.vulnerabilities || {};
          console.log(JSON.stringify({
            added:p.added, removed:p.removed, changed:p.changed,
            auditMetadata:root,
            auditErrors:p.error ? {code:p.error.code,summary:p.error.summary} : null,
            advisories:Object.entries(p.audit?.vulnerabilities || p.vulnerabilities || {}).map(([name,v])=>({
              name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable
            }))
          },null,2));
          NODE
          echo "Resolved package versions available within the pinned Expo patch range:"
          npm view expo@'~57.0.26' version --json
          echo "Latest node-forge stable version:"
          npm view node-forge version
      - name: Remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-mobile-audit-plan.yml
          git commit -m "chore(security): remove mobile audit plan diagnostic"
          git push origin security/nextjs-16.4.6-patch-2026-11-25
