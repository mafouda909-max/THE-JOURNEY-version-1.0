name: One-time Next.js lockfile regeneration

on:
  push:
    branches:
      - security/nextjs-16.4.6-patch-2026-11-25
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate:
    if: github.ref == 'refs/heads/security/nextjs-16.4.6-patch-2026-11-25'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/nextjs-16.4.6-patch-2026-11-25
      - name: Setup repository Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify the intended patch versions
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.4.6'||p.devDependencies['eslint-config-next']!=='16.4.6') process.exit(1)"
      - name: Regenerate only the root npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean lockfile installation and resolved copies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls next --all
          npm ls eslint-config-next --all
      - name: Commit generated lockfile and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/one-time-next-lockfile.yml
          git commit -m "fix(security): regenerate lockfile for Next.js 16.4.6"
          git push origin security/nextjs-16.4.6-patch-2026-11-25
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
