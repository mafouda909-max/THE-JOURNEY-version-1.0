name: Import verified Journey workspace

on:
  push:
    branches: [main]
    paths: ['IMPORT_JOURNEY_WORKSPACE.trigger']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and sanitize workspace
        shell: bash
        run: |
          set -euo pipefail
          ZIP='workspace-01a05517-f80f-7783-a70b-ecb479e9600c.zip'
          test -f "$ZIP"
          rm -rf /tmp/journey-src
          mkdir -p /tmp/journey-src
          unzip -q "$ZIP" -d /tmp/journey-src

          rm -rf .github 2>/dev/null || true
          find /tmp/journey-src -type d -name .git -prune -exec rm -rf {} +
          find /tmp/journey-src -type d -name .mcp-auth -prune -exec rm -rf {} +
          find /tmp/journey-src -type d -name .next -prune -exec rm -rf {} +
          find /tmp/journey-src -type d -name node_modules -prune -exec rm -rf {} +
          find /tmp/journey-src -type f \( \
            -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*admin-key*' -o -name 'tsconfig.tsbuildinfo' \
          \) -print -delete
          rm -f /tmp/journey-src/project.zip
          rm -f IMPORT_JOURNEY_WORKSPACE.trigger
          rm -f workspace-01a05517-f80f-7783-a70b-ecb479e9600c.zip

          # Preserve repository metadata and import only the sanitized workspace.
          cp -a /tmp/journey-src/. ./

          # Prevent nested/local artifacts from becoming tracked source.
          rm -rf .config .sudo_as_admin_successful 2>/dev/null || true
          rm -f opencode.json 2>/dev/null || true
          rm -rf config/mcp.json 2>/dev/null || true

      - name: Validate manifests and source
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f tsconfig.json
          test -f next.config.ts
          test -d src
          find src -type f | wc -l

      - name: Commit imported baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'chore: establish THE JOURNEY workspace baseline [imported]' || exit 0
          git push origin HEAD:main
