name: Inspect uploaded Journey ZIP

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Extract ZIP to temporary workspace
        shell: bash
        run: |
          set -euo pipefail
          ZIP='workspace-01a05517-f80f-7783-a70b-ecb479e9600c.zip'
          test -f "$ZIP"
          rm -rf /tmp/journey-inspect
          mkdir -p /tmp/journey-inspect/unpacked /tmp/journey-inspect/safe
          unzip -q "$ZIP" -d /tmp/journey-inspect/unpacked
          find /tmp/journey-inspect/unpacked -type d -name .git -prune -exec rm -rf {} +
          find /tmp/journey-inspect/unpacked -type f \( \
            -name '.env' -o -name '.env.*' -o -name '*admin-key*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \
          \) -print -delete
          cp -a /tmp/journey-inspect/unpacked/. /tmp/journey-inspect/safe/

      - name: Generate inventory
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/journey-inspect/safe
          {
            echo '# THE JOURNEY ZIP INVENTORY'
            echo
            echo 'Generated from uploaded workspace ZIP.'
            echo
            echo '## Top-level entries'
            find . -maxdepth 2 -mindepth 1 -print | sort | head -400
            echo
            echo '## Project manifests'
            find . -type f \( -name 'package.json' -o -name 'package-lock.json' -o -name 'pnpm-lock.yaml' -o -name 'yarn.lock' -o -name 'tsconfig.json' -o -name 'next.config.*' -o -name 'drizzle.config.*' -o -name 'README*' -o -name '*HANDOFF*.md' -o -name '*LAUNCH*REPORT*.md' \) -print | sort
            echo
            echo '## Source file count'
            find . -type f | wc -l
          } > /tmp/journey-inspect/INVENTORY.md

      - name: Package safe inspection bundle
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/journey-inspect
          tar -czf journey-safe-inspection.tar.gz -C safe .
          tar -czf journey-inventory.tar.gz INVENTORY.md

      - name: Upload inspection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: journey-zip-inspection-${{ github.sha }}
          path: |
            /tmp/journey-inspect/INVENTORY.md
            /tmp/journey-inspect/journey-safe-inspection.tar.gz
            /tmp/journey-inspect/journey-inventory.tar.gz
          retention-days: 7
