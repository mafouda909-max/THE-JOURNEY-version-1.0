name: Production DB Contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-db:
    name: Verify production database contract
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        # Pinned by full commit SHA (tag actions/checkout@v7) because this
        # repository requires actions to be pinned to a full-length SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate DATABASE_URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub secret is not configured."
            exit 1
          fi

      - name: Check production schema
        run: npx tsx scripts/check-production-schema.ts
