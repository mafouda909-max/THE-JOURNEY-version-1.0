name: One-time mobile audit diagnostic

on:
  push:
    branches:
      - security/nextjs-16.4.6-patch-2026-11-25
    paths:
      - .github/workflows/one-time-mobile-audit.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.ref == 'refs/heads/security/nextjs-16.4.6-patch-2026-11-25'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect exact production audit findings and dependency paths
        working-directory: .
        run: |
          npm --prefix mobile audit --omit=dev --json > mobile-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('mobile-audit.json','utf8'));
          const rows = Object.entries(audit.vulnerabilities || {}).map(([name,v]) => ({
            name,
            severity:v.severity,
            direct:v.isDirect,
            range:v.range,
            fixAvailable:v.fixAvailable,
            via:(v.via || []).filter(x => typeof x === 'object').map(x => ({
              title:x.title,
              url:x.url,
              range:x.range,
              fixAvailable:x.fixAvailable
            }))
          }));
          console.log(JSON.stringify({metadata:audit.metadata?.vulnerabilities, findings:rows}, null, 2));
          NODE
          npm --prefix mobile ls braces node-forge --all || true
      - name: Remove temporary diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-mobile-audit.yml
          git commit -m "chore(security): remove temporary mobile audit diagnostic"
          git push origin security/nextjs-16.4.6-patch-2026-11-25
