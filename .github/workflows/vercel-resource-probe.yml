name: Vercel Resource Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vercel-resource-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check Vercel credential availability
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_MISSING"
            exit 2
          fi
          echo "VERCEL_TOKEN_PRESENT"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest --no-audit --no-fund

      - name: Inspect project integration resources
        shell: bash
        run: |
          vercel integration list sila-platform             --scope mafouda909-max             --token="$VERCEL_TOKEN"             --format=json
