name: CI

on:
  push:
    branches: [main, codex/final-release-verification]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: no job in this workflow needs write access to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis. Fast, no database, no network beyond npm.
  # ---------------------------------------------------------------------------
  static:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Pinned by commit SHA (tag actions/checkout@v7) so a tag move cannot
        # change what CI executes.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Unit + contract tests. Deliberately runs WITHOUT DATABASE_URL: the suites
  # must stay hermetic. This job previously did not exist, so nothing in CI
  # ever executed tests/*.test.ts.
  # ---------------------------------------------------------------------------
  test:
    name: Unit & contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Guard — test suite must not need a database
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL must be unset for the test job (hermetic suites)."
            exit 1
          fi
          for f in tests/*.test.ts; do
            if grep -qE "process\.env\.DATABASE_URL\s*=" "$f"; then
              echo "$f mutates DATABASE_URL at runtime; keep unit tests hermetic."
              exit 1
            fi
          done

      - name: Test
        run: npm test

  # ---------------------------------------------------------------------------
  # Production build. No DATABASE_URL: proves the build is offline-safe
  # (self-hosted fonts, no data fetched at build time).
  # ---------------------------------------------------------------------------
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Mobile companion app (mobile/). Typechecks, runs its own unit tests and
  # bundles through Metro so an unresolvable import cannot reach a device.
  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile app (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle (Metro, iOS target)
        run: npm run bundle

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-hermes-bundle
          path: mobile/dist
          if-no-files-found: error
          retention-days: 7
