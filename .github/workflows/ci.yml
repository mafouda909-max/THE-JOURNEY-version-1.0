name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  static:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    name: Unit & contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Guard — test suite must not need a database
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL must be unset for the test job (hermetic suites)."
            exit 1
          fi
          for f in tests/*.test.ts; do
            if grep -qE "process\.env\.DATABASE_URL\s*=" "$f"; then
              echo "$f mutates DATABASE_URL at runtime; keep unit tests hermetic."
              exit 1
            fi
          done

      - name: Test
        run: npm test

  agency-db:
    name: Database security
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase1-test
          POSTGRES_DB: journey_phase1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d journey_phase1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:phase1-test@127.0.0.1:5432/journey_phase1
      AGENCY_TEST_DATABASE_URL: postgresql://postgres:phase1-test@127.0.0.1:5432/journey_phase1
      MARKETPLACE_TEST_DATABASE_URL: postgresql://postgres:phase1-test@127.0.0.1:5432/journey_phase1
      MARKETPLACE_WORKFLOW_TEST_DATABASE_URL: postgresql://postgres:phase1-test@127.0.0.1:5432/journey_phase1
      COMMERCIAL_WORKFLOW_TEST_DATABASE_URL: postgresql://postgres:phase1-test@127.0.0.1:5432/journey_phase1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Agency database security tests
        run: node --import tsx --test tests/agency-db.test.ts

      - name: Marketplace database trust tests
        run: node --import tsx --test tests/marketplace-db.test.ts

      - name: Marketplace workflow integrity tests
        run: node --import tsx --test tests/marketplace-workflow-db.test.ts

      - name: Canonical commercial workflow tests
        run: node --import tsx --test tests/commercial-workflow-db.test.ts

      - name: Marketplace inquiry adoption tests
        run: node --import tsx --test tests/marketplace-inquiry-adoption-db.test.ts

      - name: Supply freshness integrity tests
        run: node --import tsx --test tests/supply-freshness-db.test.ts

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  mobile:
    name: Mobile app (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle (Metro, iOS target)
        run: npm run bundle

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-hermes-bundle
          path: mobile/dist
          if-no-files-found: error
          retention-days: 7
