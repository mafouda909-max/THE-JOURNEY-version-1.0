name: Refresh mobile SDK 57 lock

on:
  push:
    branches: [integration/sila-resume-2026-10-03]
    paths:
      - mobile/package.json
      - .github/workflows/refresh-mobile-sdk57.yml

permissions:
  contents: write

jobs:
  refresh-mobile-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/sila-resume-2026-10-03
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Refresh mobile lockfile
        run: npm --prefix mobile install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install refreshed mobile dependencies
        run: npm --prefix mobile ci

      - name: Verify mobile bundle
        run: npm --prefix mobile run verify

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Mobile lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "chore(mobile): refresh Expo SDK 57 lockfile"
          git push origin HEAD:integration/sila-resume-2026-10-03
