name: Refresh mobile dependency lock

on:
  push:
    branches: [integration/sila-resume-2026-10-03]
    paths:
      - mobile/package.json

permissions:
  contents: write

jobs:
  refresh-mobile-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/sila-resume-2026-10-03
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Regenerate mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- mobile/package-lock.json mobile/package.json; then
            echo "Mobile lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          git commit -m "chore(mobile): refresh lock for Expo 57.0.26"
          git push origin HEAD:integration/sila-resume-2026-10-03
