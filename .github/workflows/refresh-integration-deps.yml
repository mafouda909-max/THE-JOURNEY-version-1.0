name: Refresh integration dependency lock

on:
  push:
    branches: [integration/sila-resume-2026-10-03]
    paths:
      - .github/workflows/refresh-integration-deps.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/sila-resume-2026-10-03
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Refresh patched framework versions in lockfile
        run: npm install --save-exact next@16.3.8 eslint-config-next@16.3.8 --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lock already current."
            exit 0
          fi
          git config user.name "sila-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): update patched Next.js release"
          git push origin HEAD:integration/sila-resume-2026-10-03
