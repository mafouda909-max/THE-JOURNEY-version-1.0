name: Production readiness smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-smoke
  cancel-in-progress: true

jobs:
  production-readiness:
    name: Canonical production desktop and mobile readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_PRODUCTION_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for exact healthy canonical release
        run: node scripts/wait-production.mjs
      - name: Live browser and API smoke without fixtures or credentials
        run: npx playwright test --config=playwright.production.config.ts
      - name: Preserve production proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sila-production-readiness-proof
          path: |
            production-test-results
            production-playwright-report
          if-no-files-found: ignore
          retention-days: 30
