name: Security dependency lock refresh

on:
  push:
    branches: [codex/full-project-completion]
    paths:
      - .github/workflows/security-dependency-upgrade.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/full-project-completion
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Refresh patched stable lockfile
        run: >-
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact
          next@16.3.3 react@19.2.8 react-dom@19.2.8 eslint-config-next@16.3.3
      - name: Commit generated dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency metadata changes were generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade Next and React patched stable"
          git push origin HEAD:codex/full-project-completion
