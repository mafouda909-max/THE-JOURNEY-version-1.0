name: One-time mobile audit remediation

on:
  push:
    branches:
      - security/nextjs-16.4.6-patch-2026-11-25
    paths:
      - .github/workflows/one-time-mobile-audit-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.ref == 'refs/heads/security/nextjs-16.4.6-patch-2026-11-25'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install current mobile lockfile
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply compatible non-forced audit fixes to lockfile only
        working-directory: mobile
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify clean install and exact transitive versions
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls expo @expo/cli node-forge zod glob minimatch uuid xcode --all
      - name: Verify mobile production dependency audit
        working-directory: mobile
        run: |
          npm audit --omit=dev --json > mobile-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('mobile-audit.json','utf8'));
          const metadata = audit.metadata?.vulnerabilities || {};
          const findings = Object.entries(audit.vulnerabilities || {}).map(([name,v]) => ({
            name, severity:v.severity, direct:v.isDirect, range:v.range,
            fixAvailable:v.fixAvailable,
            advisories:(v.via || []).filter(x=>typeof x==='object').map(x=>({title:x.title,url:x.url,range:x.range}))
          }));
          console.log(JSON.stringify({metadata,findings},null,2));
          if (Number(metadata.high||0)>0 || Number(metadata.critical||0)>0) process.exit(1);
          NODE
      - name: Mobile typecheck, tests and Metro bundle
        working-directory: mobile
        run: |
          npm run typecheck
          npm test
          npm run bundle
      - name: Confirm only the mobile lockfile changed
        run: |
          git diff --exit-code -- mobile/package.json
          git status --short
          git diff --check
      - name: Commit verified mobile dependency fixes and clean diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git rm .github/workflows/one-time-mobile-audit-remediation.yml
          git rm .github/workflows/one-time-mobile-audit-plan.yml
          git commit -m "fix(security): update mobile transitive dependencies"
          git push origin security/nextjs-16.4.6-patch-2026-11-25
