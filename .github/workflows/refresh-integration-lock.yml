name: Refresh integration dependency lock

on:
  push:
    branches: [integration/sila-resume-2026-10-03]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/sila-resume-2026-10-03
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): refresh lock for Next 16.3.8"
          git push origin HEAD:integration/sila-resume-2026-10-03
