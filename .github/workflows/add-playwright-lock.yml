name: Add Playwright browser dependency

on:
  push:
    branches: [integration/sila-resume-2026-10-03]
    paths:
      - .github/workflows/add-playwright-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: integration/sila-resume-2026-10-03
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Add pinned Playwright test dependency
        run: npm install --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund @playwright/test@1.63.0

      - name: Commit lock update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Playwright dependency already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "test(browser): add pinned Playwright dependency"
          git push origin HEAD:integration/sila-resume-2026-10-03
